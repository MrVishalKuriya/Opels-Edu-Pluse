spring.application.name=college-management
server.port=${PORT:8080}

# ─── DATABASE CONFIGURATION ───────────────────────────────────────────────────
# Priority 1: Supabase / PostgreSQL (set SPRING_DATASOURCE_URL on Render)
# Priority 2: H2 In-Memory fallback (local development, no setup needed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:collegedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ─── JPA / HIBERNATE ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Connection pool settings (important for Supabase free tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ─── H2 CONSOLE (local dev only) ──────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console