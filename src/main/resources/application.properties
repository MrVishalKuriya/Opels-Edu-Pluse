spring.application.name=college-management
server.port=${PORT:8080}

# Database Configuration (Cloud Friendly Fallback)
# Defaults to H2 In-Memory DB if no external SPRING_DATASOURCE_URL is supplied on Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:collegedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: To force local MySQL when running locally, uncomment below or set env vars:
